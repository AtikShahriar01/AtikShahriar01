<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <rect width="640" height="300" fill="#0a0f1e"/>
  <!-- dotted world map (simplified continents as dot clusters) -->
  <g fill="#1f3a5f">
    <circle cx="120" cy="110" r="3"/><circle cx="135" cy="100" r="3"/><circle cx="150" cy="115" r="3"/><circle cx="130" cy="130" r="3"/><circle cx="110" cy="125" r="3"/>
    <circle cx="300" cy="95" r="3"/><circle cx="320" cy="90" r="3"/><circle cx="340" cy="100" r="3"/><circle cx="330" cy="120" r="3"/><circle cx="310" cy="130" r="3"/>
    <circle cx="360" cy="160" r="3"/><circle cx="375" cy="175" r="3"/><circle cx="365" cy="195" r="3"/>
    <circle cx="470" cy="110" r="3"/><circle cx="500" cy="100" r="3"/><circle cx="530" cy="120" r="3"/><circle cx="510" cy="140" r="3"/><circle cx="480" cy="135" r="3"/><circle cx="540" cy="150" r="3"/>
    <circle cx="540" cy="220" r="3"/><circle cx="560" cy="230" r="3"/>
  </g>
  <!-- location markers -->
  <g>
    <circle cx="505" cy="140" r="6" fill="#00ff41"><animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="520" y="145" font-family="monospace" font-size="13" fill="#b6ffcc">Dhaka 🇧🇩 (home)</text>
  </g>
  <g fill="#ff073a">
    <circle cx="130" cy="115" r="4"/><text x="140" y="119" font-family="monospace" font-size="11" fill="#8ab4ff"> your cities here</text>
  </g>
  <text x="12" y="285" font-family="monospace" font-size="12" fill="#3a5a80">// home + places lived/visited — 🔑 edit markers</text>
</svg>
