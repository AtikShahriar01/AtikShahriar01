<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <rect width="720" height="360" fill="#070b16"/>
  <!-- graticule (lat/long grid) -->
  <g stroke="#12203a" stroke-width="1">
    <line x1="0" y1="60" x2="720" y2="60"/><line x1="0" y1="120" x2="720" y2="120"/>
    <line x1="0" y1="180" x2="720" y2="180"/><line x1="0" y1="240" x2="720" y2="240"/>
    <line x1="0" y1="300" x2="720" y2="300"/>
    <line x1="90" y1="0" x2="90" y2="360"/><line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="270" y1="0" x2="270" y2="360"/><line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/><line x1="540" y1="0" x2="540" y2="360"/>
    <line x1="630" y1="0" x2="630" y2="360"/>
  </g>
  <text x="6" y="58" font-family="monospace" font-size="9" fill="#2a4a6e">60°N</text>
  <text x="6" y="178" font-family="monospace" font-size="9" fill="#2a4a6e">0°</text>
  <text x="6" y="298" font-family="monospace" font-size="9" fill="#2a4a6e">60°S</text>
  <!-- dot-matrix continents -->
  <g fill="#1b3a5f">
    <circle cx="150" cy="120" r="2.4"/><circle cx="168" cy="110" r="2.4"/><circle cx="186" cy="122" r="2.4"/><circle cx="172" cy="138" r="2.4"/><circle cx="152" cy="150" r="2.4"/><circle cx="190" cy="150" r="2.4"/><circle cx="205" cy="165" r="2.4"/>
    <circle cx="250" cy="210" r="2.4"/><circle cx="262" cy="230" r="2.4"/><circle cx="258" cy="255" r="2.4"/><circle cx="268" cy="278" r="2.4"/>
    <circle cx="345" cy="105" r="2.4"/><circle cx="362" cy="100" r="2.4"/><circle cx="378" cy="112" r="2.4"/>
    <circle cx="372" cy="150" r="2.4"/><circle cx="388" cy="170" r="2.4"/><circle cx="382" cy="195" r="2.4"/><circle cx="398" cy="215" r="2.4"/>
    <circle cx="440" cy="120" r="2.4"/><circle cx="470" cy="112" r="2.4"/><circle cx="505" cy="125" r="2.4"/><circle cx="540" cy="120" r="2.4"/><circle cx="520" cy="150" r="2.4"/><circle cx="480" cy="150" r="2.4"/><circle cx="450" cy="145" r="2.4"/><circle cx="560" cy="150" r="2.4"/><circle cx="505" cy="175" r="2.4"/>
    <circle cx="600" cy="255" r="2.4"/><circle cx="620" cy="262" r="2.4"/>
  </g>
  <!-- satellite ground track (animated dashed + moving dot) -->
  <path id="track" d="M40 260 C 200 60, 520 60, 690 250" fill="none" stroke="#0b3d91" stroke-width="1.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="0" to="120" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#ff073a">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#track"/>
    </animateMotion>
  </circle>
  <!-- pulsing marker over Dhaka (23.81N, 90.41E → near x=505 y=168) -->
  <g>
    <circle cx="505" cy="168" r="4" fill="#00ff41"/>
    <circle cx="505" cy="168" r="6" fill="none" stroke="#00ff41" stroke-width="1.5">
      <animate attributeName="r" values="4;22;4" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="505" cy="168" r="6" fill="none" stroke="#00ff41" stroke-width="1.5">
      <animate attributeName="r" values="4;22;4" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <line x1="505" y1="168" x2="560" y2="120" stroke="#00ff41" stroke-width="1" opacity="0.7"/>
    <rect x="560" y="96" width="152" height="46" rx="4" fill="#001a0d" stroke="#00ff41" stroke-opacity="0.5"/>
    <text x="568" y="112" font-family="monospace" font-size="12" fill="#00ff41">🛰 DHAKA 🇧🇩 (QTH)</text>
    <text x="568" y="128" font-family="monospace" font-size="11" fill="#b6ffcc">23.81°N 90.41°E</text>
    <text x="568" y="140" font-family="monospace" font-size="9" fill="#3a5a80">GRID: 🔑 NL_xx · UTC+6</text>
  </g>
  <!-- legend -->
  <text x="12" y="346" font-family="monospace" font-size="11" fill="#3a5a80">// ground station · 🛰 satellite track · 🔑 add your cities / callsign grid</text>
</svg>
